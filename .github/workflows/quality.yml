name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python tools/secret_scan.py
      - run: python -m build
      - run: js --help && js --version && js list --json && js doctor --json && js dossier --json && js 1337
      - run: js completion bash > /tmp/js.bash && bash -n /tmp/js.bash
