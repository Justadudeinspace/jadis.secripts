name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - name: Prepare pinned optional AVB verification provider
        run: |
          python tools/prepare_avb_provider.py --output "$RUNNER_TEMP/secripts-avb"
          echo "$RUNNER_TEMP/secripts-avb" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python tools/secret_scan.py
      - run: python tools/audit_docs.py
      - run: python tools/manual.py --check
      - run: python -m build
      - run: js --help && js --version && js ls --json && js doc --json && js dos --json && js 1337
      - run: python tools/validate_images.py
      - run: python tools/validate_phase4.py
      - run: python tools/validate_phase5.py
      - run: python tools/validate_phase6.py
      - run: python tools/validate_oracles.py --fetch-upstream
      - run: js comp bash > /tmp/js.bash && bash -n /tmp/js.bash
