[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jadis-secripts"
version = "0.3.0"
description = "JADIS personal developer operations arsenal and Android Recovery Laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Christopher Osburn / JADIS"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
js = "secripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secripts = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S603", "S607"]
